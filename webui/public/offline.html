<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bot-lobby — offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #ffffff;
        --foreground: #262626;
        --muted: #737373;
        --border: #e5e5e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #262626;
          --foreground: #fafafa;
          --muted: #a3a3a3;
          --border: #3f3f3f;
        }
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: var(--background);
        color: var(--foreground);
        font: 16px/1.5 ui-sans-serif, system-ui, sans-serif;
        padding: 24px;
      }
      main {
        max-width: 28rem;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>bot-lobby is offline</h1>
      <p>Pi is not running on this computer, so there is nothing to show. Start it with <code>/bot-lobby web</code> and this page will reconnect.</p>
    </main>
  </body>
</html>
