<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bot-lobby — offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #f4f5f9;
        --card: #ffffff;
        --foreground: #14161d;
        --muted: #586070;
        --border: #e3e6ee;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #08090c;
          --card: #0e1015;
          --foreground: #e8eaf0;
          --muted: #9099ab;
          --border: #1a1e26;
        }
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: var(--background);
        color: var(--foreground);
        font: 16px/1.5 "Inter Variable", ui-sans-serif, system-ui, sans-serif;
        padding: 24px;
      }
      main {
        max-width: 28rem;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
        padding: 24px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>bot-lobby is offline</h1>
      <p>Pi is not running on this computer, so there is nothing to show. Start it with <code>/bot-lobby web</code> and this page will reconnect.</p>
    </main>
  </body>
</html>
